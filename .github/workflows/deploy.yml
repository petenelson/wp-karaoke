      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Setup known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          echo "${{ env.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts

      - name: List remote files for debugging and verify SSH connection
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "${{env.DEPLOY_USER}}" >> ~/debug.log
          echo "${{env.DEPLOY_HOST}}" >> ~/debug.log
          echo "${{env.DEPLOY_PATH}}" >> ~/debug.log
          cat ~/debug.log
          echo "Verifying SSH connection:"
          ssh -o ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "echo 'SSH connection successful!'"          echo "Listing files in the remote repository for debugging:"
          echo "Listing files in the remote repository for debugging:"
          ssh -o ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "ls -la ${{ env.DEPLOY_PATH }}"
