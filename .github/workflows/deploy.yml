name: Deploy to Production

on:
  push:
    branches:
      - trunk

permissions:
  contents: read
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for debugging, excluding node_modules and vendor
        run: |
          echo "Listing files in the repository (excluding node_modules and vendor):"
          find . -type f -not -path "./node_modules/*" -not -path "./vendor/*" -not -path "./.github/*" -not -path "./.git/*"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

