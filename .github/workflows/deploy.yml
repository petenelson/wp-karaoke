name: Deploy to Production

on:
  push:
    branches:
      - trunk

permissions:
  contents: read
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: List files for debugging, excluding node_modules and vendor
